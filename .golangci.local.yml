# The framework's own additions to lint/base.golangci.yml. Run
# `go run ./lint/cmd/lintconfig` after changing this file or the base.
run:
  # Container tests and the lint smoke test sit behind these tags; without
  # them they are never linted.
  build-tags:
    - integration
    - lintsmoke

formatters:
  # db/ is its own module with its own configuration (db/.golangci.local.yml), which keeps the
  # formatters off the files taken from go-jet. `golangci-lint fmt` from the root would
  # otherwise reformat them.
  exclusions:
    # golangci-lint run from the root never lints db/ (another module), so it prints one
    # "Skipped 0 issues" warning for this pattern; formatters.exclusions.warn-unused does not
    # silence it, and linters.exclusions.warn-unused must stay on for the rules below.
    paths:
      - ^db/
  settings:
    goimports:
      local-prefixes:
        - github.com/nanostack-dev/nanostack-framework

linters:
  settings:
    depguard:
      rules:
        # pkg/search holds aliases of db/search and will be removed. The
        # framework itself uses db/search; products move one search at a time.
        search contract is db/search:
          files:
            - $all
            - "!**/pkg/search/*.go"
          deny:
            - pkg: github.com/nanostack-dev/nanostack-framework/pkg/search$
              desc: Use github.com/nanostack-dev/nanostack-framework/db/search; pkg/search holds its aliases and will be removed
        # The layers of plan section 06: core, then the integrations (http, pg,
        # redis, otel), then gen. A package imports only its own layer and the
        # layers below it. gen is its own module with its own rules
        # (gen/.golangci.local.yml). internal/layers tests the same rule on the
        # import graph.
        core imports no upper layer:
          files:
            - "**/core/**"
          deny:
            - pkg: github.com/nanostack-dev/nanostack-framework/http/
              desc: core is the lowest layer and must not import http; move the shared code into core
            - pkg: github.com/nanostack-dev/nanostack-framework/pg/
              desc: core is the lowest layer and must not import pg; move the shared code into core
            - pkg: github.com/nanostack-dev/nanostack-framework/redis/
              desc: core is the lowest layer and must not import redis; move the shared code into core
            - pkg: github.com/nanostack-dev/nanostack-framework/otel/
              desc: core is the lowest layer and must not import otel; move the shared code into core
            - pkg: github.com/nanostack-dev/nanostack-framework/gen$
              desc: core is the lowest layer and must not import gen
            - pkg: github.com/nanostack-dev/nanostack-framework/gen/
              desc: core is the lowest layer and must not import gen
        integrations import no upper layer:
          files:
            - "**/http/**"
            - "**/pg/**"
            - "**/redis/**"
            - "**/otel/**"
          deny:
            - pkg: github.com/nanostack-dev/nanostack-framework/gen$
              desc: the integration layer sits below gen and must not import it; move the shared code into core
            - pkg: github.com/nanostack-dev/nanostack-framework/gen/
              desc: the integration layer sits below gen and must not import it; move the shared code into core
        # The legacy trees carry Fx and zerolog, which the layers replace.
        # internal/layers tests the same rule on the import graph.
        # pkg/functional is the leaf layer (internal/layers.Leaves), not legacy.
        core imports no legacy tree:
          # Lax: everything not denied is allowed, and an allow entry wins over
          # the shorter pkg/ deny.
          list-mode: lax
          files:
            - "**/core/**"
          allow:
            - github.com/nanostack-dev/nanostack-framework/pkg/functional$
          deny:
            - pkg: github.com/nanostack-dev/nanostack-framework/pkg/
              desc: pkg is legacy; move what the layers need into core
            - pkg: github.com/nanostack-dev/nanostack-framework/modules/
              desc: modules is legacy Fx wiring; the layers use core/nano and nano gen wire
            - pkg: github.com/nanostack-dev/nanostack-framework/app$
              desc: app is legacy Fx assembly; the layers use core/nano and nano gen wire
            - pkg: github.com/nanostack-dev/nanostack-framework/app/
              desc: app is legacy Fx assembly; the layers use core/nano and nano gen wire
        # Design B1: an integration package may import only the pkg primitives
        # of internal/layers.AllowedLegacy, which carry no Fx and no zerolog,
        # and the leaf pkg/functional (internal/layers.Leaves). Keep this list
        # and those two equal.
        integrations import no legacy tree but the allow-list:
          # Lax: everything not denied is allowed, and an allow entry wins over
          # the shorter pkg/ deny.
          list-mode: lax
          files:
            - "**/http/**"
            - "**/pg/**"
            - "**/redis/**"
            - "**/otel/**"
          allow:
            - github.com/nanostack-dev/nanostack-framework/pkg/apisec$
            - github.com/nanostack-dev/nanostack-framework/pkg/db/pgerr$
            - github.com/nanostack-dev/nanostack-framework/pkg/db/transactor$
            - github.com/nanostack-dev/nanostack-framework/pkg/functional$
            - github.com/nanostack-dev/nanostack-framework/pkg/health$
            - github.com/nanostack-dev/nanostack-framework/pkg/jetx$
            - github.com/nanostack-dev/nanostack-framework/pkg/tracing$
          deny:
            - pkg: github.com/nanostack-dev/nanostack-framework/pkg/
              desc: pkg is legacy; only the primitives of internal/layers.AllowedLegacy are allowed
            - pkg: github.com/nanostack-dev/nanostack-framework/modules/
              desc: modules is legacy Fx wiring; the layers use core/nano and nano gen wire
            - pkg: github.com/nanostack-dev/nanostack-framework/app$
              desc: app is legacy Fx assembly; the layers use core/nano and nano gen wire
            - pkg: github.com/nanostack-dev/nanostack-framework/app/
              desc: app is legacy Fx assembly; the layers use core/nano and nano gen wire
        # zerolog is denied everywhere by the base rules.
        layers use no fx:
          files:
            - "**/core/**"
            - "**/http/**"
            - "**/pg/**"
            - "**/redis/**"
            - "**/otel/**"
          deny:
            - pkg: go.uber.org/fx
              desc: the layers replace Fx; use core/nano and nano gen wire (ADR 0013)
            - pkg: go.uber.org/dig
              desc: the layers replace Fx; use core/nano and nano gen wire (ADR 0013)
    gocritic:
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          rules: ${base-path}/gorules/functional.go,${base-path}/gorules/transactor.go
          failOn: all

  # Findings that predate the standard: one file per line, sorted, with the
  # linters it silences and what they hide. Fix one, delete it from its line and
  # lower the budget below.
  exclusions:
    rules:
      - {linters: [depguard], path: ^modules/cache/cache\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^modules/cache/cache_test\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard, staticcheck], path: ^modules/cache/module\.go$} # imports zerolog; SA1019 imports the deprecated modules/config; legacy, deleted with fx
      - {linters: [depguard], path: ^modules/cache/redis\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^modules/cache/redis_test\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^modules/config/module\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^modules/httpserver/module\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^modules/httpserver/strict_error_handler\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^modules/httpserver/strict_error_handler_test\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^modules/httpserver/tracing_test\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^modules/logging/binder\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard, staticcheck], path: ^modules/logging/logging\.go$} # imports zerolog; SA1019 imports the deprecated pkg/fxlog; legacy, deleted with fx
      - {linters: [depguard], path: ^modules/logging/logging_test\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^modules/migrations/migrations_integration_test\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^modules/migrations/migrator\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^modules/migrations/migrator_test\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard, staticcheck], path: ^modules/migrations/module\.go$} # imports zerolog; SA1019 imports the deprecated modules/config; legacy, deleted with fx
      - {linters: [depguard, staticcheck], path: ^modules/pglock/pglock\.go$} # imports zerolog; SA1019 imports the deprecated modules/config; legacy, deleted with fx
      - {linters: [depguard], path: ^modules/pglock/pglock_test\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard, staticcheck], path: ^modules/postgres/postgres\.go$} # imports zerolog; SA1019 imports the deprecated modules/config; legacy, deleted with fx
      - {linters: [depguard], path: ^modules/pprof/module\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^modules/tracing/tracing\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^modules/tracing/tracing_test\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^pkg/fxlog/fxlog\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^pkg/fxlog/fxlog_test\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^pkg/httputil/requestlog/context\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^pkg/httputil/requestlog/context_test\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^pkg/httputil/requestlog/enricher\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^pkg/httputil/requestlog/enricher_test\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^pkg/httputil/requestlog/requestlog\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^pkg/httputil/requestlog/requestlog_test\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^pkg/httputil/requestlog/stream_test\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^pkg/httputil/requestlog/trace_test\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^pkg/log/component\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^pkg/log/component_test\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^pkg/log/enricher\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^pkg/log/log\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^pkg/log/log_test\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^pkg/log/severity\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^pkg/log/severity_test\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^pkg/log/trace\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^pkg/log/trace_test\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^pkg/queueworker/lifecycle\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^pkg/queueworker/lifecycle_test\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [depguard], path: ^pkg/redisx/topic\.go$} # imports zerolog; legacy, deleted after the slog migration
      - {linters: [exhaustive], path: ^pkg/db/transactor/keyset_test\.go$} # 4 Key maps list only the sorts a test uses
      - {linters: [funlen], path: ^pkg/testkit/searchtest/searchtest\.go$} # CheckRefusals, 63 statements
      - {linters: [gocognit], path: ^modules/httpserver/module\.go$} # setupRouter, complexity 21
      - {linters: [gocognit], path: ^pkg/testkit/searchtest/searchtest\.go$} # CheckRefusals, complexity 34
      - {linters: [gosec], path: ^modules/config/configloader\.go$} # G703 on the config and .env paths the service passes
      - {linters: [govet], path: ^modules/cache/redis_fallback_test\.go$} # shadow: loadErr
      - {linters: [govet], path: ^modules/config/configloader\.go$} # shadow: err x3
      - {linters: [govet], path: ^modules/httpserver/module\.go$} # shadow: err
      - {linters: [govet], path: ^modules/migrations/migrator\.go$} # shadow: err
      - {linters: [govet], path: ^modules/pglock/pglock\.go$} # shadow: err x3
      - {linters: [govet], path: ^modules/postgres/postgres\.go$} # shadow: err
      - {linters: [govet], path: ^pkg/search/cursor_test\.go$} # shadow: err
      - {linters: [govet], path: ^pkg/secrets/versioned_cipher\.go$} # shadow: err
      - {linters: [govet], path: ^pkg/testkit/searchtest/mutations\.go$} # shadow: err x2
      - {linters: [govet], path: ^pkg/testkit/searchtest/searchtest\.go$} # shadow: err x5
      - {linters: [govet], path: ^pkg/testkit/searchtest/searchtest_test\.go$} # shadow: err x2
      - {linters: [govet], path: ^pkg/tracing/provider_test\.go$} # shadow: err x2
      - {linters: [govet], path: ^pkg/validate/validator\.go$} # shadow: err x12
      - {linters: [revive], path: ^pkg/validate/default_validator\.go$} # ValidateStruct stutters; renaming breaks callers
      - {linters: [unparam], path: ^pkg/tracing/http_test\.go$} # serve always gets GET
nanostack:
  # One per linter in each rule above; lintconfig fails when they differ.
  exclusion-budget: 70
