name: DB

on:
  pull_request:
    paths:
      - "db/**"
      - "pkg/functional/**"
      - ".github/workflows/db.yml"
  push:
    branches: [main]
    paths:
      - "db/**"
      - "pkg/functional/**"
      - ".github/workflows/db.yml"
  # Weekly run of the integration suites in random test order (see integration-shuffle).
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: true

# Each module builds on its own, as a release does (go.work is for development only).
env:
  GOWORK: "off"

jobs:
  # A known advisory that the code reaches fails the pull request (see ci.yml).
  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        dir: [db, db/tests]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
      # The db/tests suites import the pinned jet-test-data, fetched before they compile.
      - name: Fetch the test data
        if: matrix.dir == 'db/tests'
        run: go run ./tools/fetchtestdata
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: db
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: db/go.mod
          cache-dependency-path: |
            db/go.sum
            db/tests/go.sum
            db/examples/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      # The quick-start example is its own module; upstream's README sends readers to it.
      - name: Build the examples
        working-directory: db/examples
        run: go vet ./...
      # The suites import testdata/results/common, a Go package inside the pinned
      # jet-test-data (no license, never committed): fetch it before anything compiles them.
      - name: Fetch the test data
        working-directory: db/tests
        run: go run ./tools/fetchtestdata
      - name: Vet the integration suites
        working-directory: db/tests
        run: |
          go vet -tags postgres ./...
          go vet ./...
      - name: Test the harness
        working-directory: db/tests
        run: go test -race -count=1 ./internal/... ./tools/...

  # Lints the Nanostack files of db and db/tests with the framework's standard
  # (db/.golangci.local.yml says which files and why).
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The ruleguard rules in gorules/ import go-ruleguard/dsl, which only the root module
    # requires, and db must not depend on it: lint in a workspace of the repository's
    # modules, as development does (go.work is git-ignored, so the job creates it).
    env:
      GOWORK: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: db/go.mod
          cache-dependency-path: |
            go.sum
            db/go.sum
            db/tests/go.sum
      - name: Generated lint config is current
        run: go run ./lint/cmd/lintconfig -check -dir db
      # The files taken from go-jet keep upstream's style (UPSTREAM.md, rule 1). The formatter
      # exclusions in db/.golangci.local.yml list them from their go-jet header.
      - name: Formatter exclusions list every go-jet file
        working-directory: db
        run: go run ./tools/upstreamfmt
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: db/.golangci-lint-version
          install-only: true
      - name: Create the workspace
        run: go work init . ./db ./db/tests ./pkg/functional
      # `golangci-lint fmt --diff` exits 1 and prints the diff when a formatter would change
      # a file. The db/ command fails on a misformatted Nanostack file. The root command makes
      # sure the root configuration keeps its formatters off db/.
      - name: Formatters leave db unchanged
        run: |
          (cd db && golangci-lint fmt --diff ./...)
          golangci-lint fmt --diff ./db/...
      - name: Lint db
        working-directory: db
        run: golangci-lint run ./...
      # The suites import a Go package from the pinned test data (see the unit job).
      - name: Fetch the test data
        working-directory: db/tests
        run: go run ./tools/fetchtestdata
      - name: Lint db/tests
        working-directory: db/tests
        run: golangci-lint run ./...

  # One job per database. The testenv harness in db/tests starts the containers, loads
  # the pinned jet-test-data and runs the suite; Docker is preinstalled on the runner.
  # CockroachDB is not tested: framework ADR 0015 drops it (decided 2026-11-11; its two
  # jobs were the longest of the workflow, 270-340 s). The testenv harness still knows the
  # cockroach source, for a local NANODB_DIALECTS=cockroach run.
  integration:
    name: integration (${{ matrix.dialect }}${{ matrix.stmt_cache && format(', statement cache {0}', matrix.stmt_cache) || '' }}${{ matrix.pg_driver && format(', {0}', matrix.pg_driver) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each dialect runs twice, in parallel jobs: the race suite and the
          # statement-cache suite. One job ran both in sequence (about 6 min).
          # The postgres suite also runs once per driver (pq and pgx), so each
          # driver gets its own job too (NANODB_PG_DRIVERS).
          - { dialect: postgres14, package: ./postgres, stmt_cache: "off", pg_driver: postgres }
          - { dialect: postgres14, package: ./postgres, stmt_cache: "off", pg_driver: pgx }
          - { dialect: postgres14, package: ./postgres, stmt_cache: "on", pg_driver: postgres }
          - { dialect: postgres14, package: ./postgres, stmt_cache: "on", pg_driver: pgx }
          - { dialect: postgres18, package: ./postgres, stmt_cache: "off", pg_driver: postgres }
          - { dialect: postgres18, package: ./postgres, stmt_cache: "off", pg_driver: pgx }
          - { dialect: postgres18, package: ./postgres, stmt_cache: "on", pg_driver: postgres }
          - { dialect: postgres18, package: ./postgres, stmt_cache: "on", pg_driver: pgx }
          - { dialect: mysql, package: ./mysql, stmt_cache: "off" }
          - { dialect: mysql, package: ./mysql, stmt_cache: "on" }
          - { dialect: mariadb, package: ./mysql, stmt_cache: "off" }
          - { dialect: mariadb, package: ./mysql, stmt_cache: "on" }
          - { dialect: sqlite, package: ./sqlite, stmt_cache: "off" }
          - { dialect: sqlite, package: ./sqlite, stmt_cache: "on" }
    defaults:
      run:
        working-directory: db/tests
    env:
      NANODB_DIALECTS: ${{ matrix.dialect }}
      NANODB_PG_DRIVERS: ${{ matrix.pg_driver }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        id: go
        with:
          go-version-file: db/tests/go.mod
          cache: false
      # One build cache per package and race flag. setup-go keys its cache on
      # go.sum alone, so all 16 jobs shared one, saved by whichever job ended
      # first (often SQLite): the postgres race builds then compiled from
      # scratch, 95 s of a 189 s step. The sources hash makes every commit save
      # a fresh cache; restore-keys start from the newest one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: db-it-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ matrix.package }}-${{ matrix.stmt_cache == 'off' && 'race' || 'norace' }}-${{ hashFiles('db/**/*.go', 'db/**/go.sum') }}
          restore-keys: |
            db-it-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ matrix.package }}-${{ matrix.stmt_cache == 'off' && 'race' || 'norace' }}-
      - name: Fetch the test data
        run: go run ./tools/fetchtestdata
      # -count=1: the restored build cache must never replay a result without the database.
      # -tags postgres compiles the PostgreSQL-only range tests, as upstream CI did.
      - name: Test
        if: matrix.stmt_cache != 'on'
        run: go test -race -count=1 -tags postgres -v ${{ matrix.package }}
      - name: Test with statement caching
        if: matrix.stmt_cache != 'off'
        run: go test -count=1 -tags postgres -v ${{ matrix.package }}
        env:
          NANODB_STMT_CACHE: "true"

  # Random test order catches tests that depend on state an earlier test left behind
  # (such as a table lock on a pooled connection). The seed is printed on failure;
  # reproduce with -shuffle=<seed>.
  integration-shuffle:
    name: integration shuffled (${{ matrix.dialect }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dialect: postgres14, package: ./postgres }
          - { dialect: postgres18, package: ./postgres }
          - { dialect: mysql, package: ./mysql }
          - { dialect: mariadb, package: ./mysql }
          - { dialect: sqlite, package: ./sqlite }
    defaults:
      run:
        working-directory: db/tests
    env:
      NANODB_DIALECTS: ${{ matrix.dialect }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: db/tests/go.mod
          cache-dependency-path: db/tests/go.sum
      - name: Fetch the test data
        run: go run ./tools/fetchtestdata
      - name: Test in random order
        run: go test -count=1 -tags postgres -shuffle=on -v ${{ matrix.package }}
