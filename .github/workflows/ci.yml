name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each module builds on its own, as a release does: a developer's go.work (git-ignored)
# must never change what CI tests.
env:
  GOWORK: "off"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Generated lint config is current, exclusions match their budget
        run: go run ./lint/cmd/lintconfig -check
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version
          install-only: true
      # A full ./... run, so warn-unused names only rules that match nothing anywhere.
      - name: Lint, and fail on an exclusion rule that matches nothing
        run: |
          code=0
          golangci-lint run ./... 2>lint.log || code=$?
          cat lint.log >&2
          # The root's formatter exclusion of db/ (another module) never matches under run;
          # it only keeps `golangci-lint fmt` off go-jet's files (.golangci.local.yml).
          if sed 's/\[Path: \\"\^db\/\\", Linters: \\"goimports, golines\\"\]//' lint.log |
            grep -q 'Skipped 0 issues by rules: .*\['; then
            echo "::error::An exclusion rule in .golangci.local.yml matches nothing. Delete it and lower nanostack.exclusion-budget."
            code=1
          fi
          exit "$code"
      # Packages with Go 1.27 generic methods, one loaded from export data. The
      # test fails on a linter crash, and on a hang after 3 minutes with a
      # goroutine dump. lint/README.md explains it.
      - name: Lint smoke, generic methods neither crash nor hang the linters
        timeout-minutes: 10
        run: go test -tags lintsmoke -count=1 -v ./lint/smoke/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      # internal/nanoexample wires every nano module, as a service does. A module
      # change that breaks the graph or the config binding fails here. The pipeline
      # reads internal/nanoexample/nanogen/project.go and runs every step it finds,
      # as `go tool nanostack gen -check` does in a service. nanostack is in the gen module,
      # which requires the root, so it runs from gen/ (go -C).
      - name: Generated code of internal/nanoexample is current (nanostack gen -check)
        run: go -C gen run ./cmd/nanostack gen -check -dir ../internal/nanoexample
      # The api step writes the example's std-http server with the nano templates.
      - name: Generated code of http/nanohttp/internal/example is current (nanostack gen -check)
        run: go -C gen run ./cmd/nanostack gen -check -dir ../http/nanohttp/internal/example

  # The container tests behind the integration tag, which the test job does not
  # build. No -race: golang-migrate's GracefulStop races under -race (see
  # pg/nanomigrate), and its graceful-stop test skips itself there.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: itpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      # Each package starts its own server through testcontainers (Docker is on
      # ubuntu-latest), so the packages run in parallel.
      - name: Nano modules and Redis primitives (testcontainers)
        run: go test -tags integration -count=1 ./pg/... ./redis/... ./pkg/redisx/... ./pkg/testkit/redistest/...
      # These packages read a DSN and share the one service database, so they
      # run one package at a time.
      - name: Transactor, keyset, search and the legacy modules (shared PostgreSQL)
        env:
          PGERR_TEST_DSN: postgres://postgres:itpass@localhost:5432/postgres?sslmode=disable
          POSTGRES_TEST_DSN: postgres://postgres:itpass@localhost:5432/postgres?sslmode=disable
          MIGRATIONS_TEST_DSN: postgres://postgres:itpass@localhost:5432/postgres?sslmode=disable
        run: >-
          go test -tags integration -count=1 -p 1
          ./pkg/db/... ./pkg/testkit/searchtest/... ./modules/migrations/... ./modules/postgres/...

  # A known advisory that the code reaches fails the pull request. The version is
  # pinned so a new govulncheck release cannot change the verdict unannounced.
  # db.yml covers db and db/tests; release.yml runs the same check on a tag.
  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        dir: [".", pkg/functional, gen]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # pkg/functional is its own module, so the root `go test ./...` does not reach it.
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pkg/functional
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: pkg/functional/go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Generated lint config is current
        working-directory: .
        run: go run ./lint/cmd/lintconfig -check -dir pkg/functional
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: pkg/functional/.golangci-lint-version
          install-only: true
      # The ruleguard rules in gorules/ import go-ruleguard/dsl, which only the root module
      # requires, so lint runs in a workspace of the repository's modules (as in db.yml).
      - name: Lint
        env:
          GOWORK: ""
        run: |
          (cd ../.. && go work init . ./pkg/functional)
          golangci-lint run ./...

  # gen holds the generators and the nanostack CLI (gen/cmd/nanostack). It is its own module, so
  # that golang.org/x/tools and the other generator dependencies stay out of the root
  # module's graph; the root `go test ./...` and lint do not reach it.
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gen
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: gen/go.mod
          cache-dependency-path: |
            go.sum
            gen/go.sum
      - run: go vet ./...
      - run: go test -count=1 ./...
      # The tests behind the integration tag start PostgreSQL and TimescaleDB
      # containers (Docker is on ubuntu-latest): the db step's key rule against a live
      # catalogue, the goldens, nanogen.sum and the orphans of a dropped table, and
      # every helper of the generated repository base.
      - name: db step and repo base on PostgreSQL (testcontainers)
        run: go test -tags integration -count=1 ./db/... ./pipeline/... ./repo/...
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Generated lint config is current
        working-directory: .
        run: go run ./lint/cmd/lintconfig -check -dir gen
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: gen/.golangci-lint-version
          install-only: true
      # The ruleguard rules in gorules/ import go-ruleguard/dsl, which only the root module
      # requires, so lint runs in a workspace of the repository's modules (as in functional).
      - name: Lint
        env:
          GOWORK: ""
        run: |
          (cd .. && go work init . ./gen)
          golangci-lint run ./...
