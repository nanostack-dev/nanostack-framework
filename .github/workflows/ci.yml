name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each module builds on its own, as a release does: a developer's go.work (git-ignored)
# must never change what CI tests.
env:
  GOWORK: "off"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Generated lint config is current, exclusions match their budget
        run: go run ./lint/cmd/lintconfig -check
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version
          install-only: true
      # A full ./... run, so warn-unused names only rules that match nothing anywhere.
      - name: Lint, and fail on an exclusion rule that matches nothing
        run: |
          code=0
          golangci-lint run ./... 2>lint.log || code=$?
          cat lint.log >&2
          if grep -q 'Skipped 0 issues by rules' lint.log; then
            echo "::error::An exclusion rule in .golangci.local.yml matches nothing. Delete it and lower nanostack.exclusion-budget."
            code=1
          fi
          exit "$code"
      # Packages with Go 1.27 generic methods, one loaded from export data. The
      # test fails on a linter crash, and on a hang after 3 minutes with a
      # goroutine dump. lint/README.md explains it.
      - name: Lint smoke, generic methods neither crash nor hang the linters
        timeout-minutes: 10
        run: go test -tags lintsmoke -count=1 -v ./lint/smoke/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      # internal/nanoexample wires every nano module, as a service does. A module
      # change that breaks the graph or the config binding fails here.
      - name: Generated wiring and config of internal/nanoexample are current
        run: |
          go run ./cmd/nano gen config -check -dir internal/nanoexample
          go run ./cmd/nano gen wire -check -dir internal/nanoexample -out .

  # The container tests behind the integration tag, which the test job does not
  # build. No -race: golang-migrate's GracefulStop races under -race (see
  # pg/nanomigrate), and its graceful-stop test skips itself there.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: itpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Each package starts its own server through testcontainers (Docker is on
      # ubuntu-latest), so the packages run in parallel.
      - name: Nano modules and Redis primitives (testcontainers)
        run: go test -tags integration -count=1 ./pg/... ./redis/... ./pkg/redisx/... ./pkg/testkit/redistest/...
      # These packages read a DSN and share the one service database, so they
      # run one package at a time.
      - name: Transactor, keyset, search and the legacy modules (shared PostgreSQL)
        env:
          PGERR_TEST_DSN: postgres://postgres:itpass@localhost:5432/postgres?sslmode=disable
          POSTGRES_TEST_DSN: postgres://postgres:itpass@localhost:5432/postgres?sslmode=disable
          MIGRATIONS_TEST_DSN: postgres://postgres:itpass@localhost:5432/postgres?sslmode=disable
        run: >-
          go test -tags integration -count=1 -p 1
          ./pkg/db/... ./pkg/testkit/searchtest/... ./modules/migrations/... ./modules/postgres/...

  # pkg/functional is its own module, so the root `go test ./...` does not reach it.
  functional:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkg/functional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pkg/functional/go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Generated lint config is current
        working-directory: .
        run: go run ./lint/cmd/lintconfig -check -dir pkg/functional
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: pkg/functional/.golangci-lint-version
          install-only: true
      # The ruleguard rules in gorules/ import go-ruleguard/dsl, which only the root module
      # requires, so lint runs in a workspace of the repository's modules (as in db.yml).
      - name: Lint
        env:
          GOWORK: ""
        run: |
          (cd ../.. && go work init . ./pkg/functional)
          golangci-lint run ./...
