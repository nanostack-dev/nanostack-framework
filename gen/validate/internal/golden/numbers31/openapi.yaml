openapi: 3.1.0
info: {title: golden, version: "1"}
paths:
  /check:
    post:
      operationId: check
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Body'}
      responses:
        "204": {description: ok}
components:
  schemas:
    Body:
      type: object
      properties:
        price: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1000}
        qty: {type: [integer, "null"], minimum: 1}
        level: {type: integer, minimum: 1, maximum: 5}
