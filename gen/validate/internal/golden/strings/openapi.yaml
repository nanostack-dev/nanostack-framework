openapi: 3.0.3
info: {title: golden, version: "1"}
paths:
  /check:
    post:
      operationId: check
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Body'}
      responses:
        "204": {description: ok}
components:
  schemas:
    Body:
      type: object
      properties:
        name: {type: string, minLength: 2, maxLength: 5}
        slug: {type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
        notBlank: {type: string, pattern: '.*\S.*'}
        color: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        word: {type: string, pattern: '^A\w+$'}
