openapi: 3.0.3
info: {title: golden, version: "1"}
paths:
  /check:
    post:
      operationId: check
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Body'}
      responses:
        "204": {description: ok}
components:
  schemas:
    Item:
      type: object
      required: [sku]
      properties:
        sku: {type: string, minLength: 1}
    Body:
      type: object
      properties:
        tags:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: {type: string, maxLength: 4}
        items:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/Item'}
        matrix:
          type: array
          items:
            type: array
            maxItems: 2
            items: {type: integer, minimum: 0}
