openapi: 3.0.3
info: {title: golden, version: "1"}
paths:
  /check:
    post:
      operationId: check
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Body'}
      responses:
        "204": {description: ok}
components:
  schemas:
    Body:
      type: object
      properties:
        age: {type: integer, minimum: 18, maximum: 130}
        score: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1, exclusiveMaximum: true}
        step: {type: integer, multipleOf: 5}
        ratio: {type: number, multipleOf: 0.1}
        small: {type: integer, format: int32, maximum: 10.5}
