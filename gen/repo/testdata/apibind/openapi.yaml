openapi: 3.0.3
info:
  title: apibind
  version: "1"
paths:
  /routes/search:
    post:
      operationId: SearchRoutes
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteSearchRequest"
  /windows/search:
    post:
      operationId: SearchWindows
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WindowSearchRequest"
  /recent/search:
    post:
      operationId: SearchRecent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecentSearchRequest"
components:
  schemas:
    SearchRequest:
      type: object
      properties:
        full_text_search:
          type: string
          maxLength: 200
        sort_direction:
          type: string
          enum: [ASC, DESC]
    Pagination:
      type: object
      properties:
        limit:
          type: integer
          default: 20
          maximum: 1000
        offset:
          type: integer
        cursor:
          type: string
    RouteSearchRequest:
      allOf:
        - $ref: "#/components/schemas/SearchRequest"
        - type: object
          properties:
            filter:
              type: object
              properties:
                names:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                    maxLength: 100
                skus:
                  type: array
                  items:
                    type: string
            sort_by:
              type: string
              enum: [route_name, name, resource, weight]
            pagination:
              $ref: "#/components/schemas/Pagination"
    WindowSearchRequest:
      type: object
      required: [filter]
      properties:
        filter:
          type: object
          properties:
            created_from:
              type: string
              format: date-time
            created_to:
              type: string
              format: date-time
            deleted_after:
              type: string
              format: date-time
            deleted_before:
              type: string
              format: date-time
            folder_id:
              type: string
        sort_direction:
          type: string
          enum: [ASC, DESC]
    RecentSearchRequest:
      type: object
      properties:
        filter:
          type: object
          properties:
            since:
              type: string
              format: date-time
        full_text_search:
          type: string
        pagination:
          $ref: "#/components/schemas/Pagination"
