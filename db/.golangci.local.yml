# Nanostack DB's additions to lint/base.golangci.yml. From the repository root, run
# `go run ./lint/cmd/lintconfig -dir db` after changing this file or the base.
#
# One configuration serves the db module and the nested db/tests module: golangci-lint
# finds it from either, and every path below is relative to this directory.
run:
  relative-path-mode: cfg
  # The PostgreSQL-only range tests in db/tests sit behind this tag, as upstream's do.
  build-tags:
    - postgres

formatters:
  # Files taken from go-jet keep upstream's style (UPSTREAM.md, rule 1), and `golangci-lint fmt`
  # ignores linters.exclusions.paths-except, so they are listed here. The list comes from the
  # go-jet header of each file: `go run ./tools/upstreamfmt -write` rewrites it, and CI fails
  # when it is stale.
  exclusions:
    # BEGIN upstreamfmt
    paths:
      - ^(doc)\.go$
      - ^cmd/jet/(main|main_test|version)\.go$
      - ^examples/
      - ^generator/metadata/(column_meta_data|dialect_query_set|enum_meta_data|schema_meta_data|table_meta_data)\.go$
      - ^generator/mysql/(mysql_generator|query_set)\.go$
      - ^generator/postgres/(postgres_generator|query_set)\.go$
      - ^generator/sqlite/(query_set|sqlite_generator)\.go$
      - ^generator/template/(file_templates|format|format_test|generator_template|model_template|model_template_test|process|sql_builder_template|sql_builder_template_test)\.go$
      - ^internal/3rdparty/
      - ^internal/jet/(alias|array_expression|array_expression_test|blob_expression|bool_expression|bool_expression_test|clause|clause_test|column|column_assigment|column_list|column_list_assigment|column_list_test|column_test|column_types|column_types_test|date_expression|dialect|enum_value|expression|expression_test|float_expression|float_expression_test|func_expression|func_expression_test|group_by_clause|integer_expression|integer_expression_test|interval_expression|keyword|literal_expression|literal_expression_test|logger|numeric_expression|operators|operators_test|order_by_clause|order_set_aggregate_functions|projection|projection_test|range_expression|range_expression_test|raw_statement|raw_statement_test|row_expression|select_lock|select_table|serializer|sql_builder|sql_builder_test|statement|string_expression|string_expression_test|string_or_blob_expression|table|table_test|testutils_test|time_expression|time_expression_test|timestamp_expression|timestamp_expression_test|timestampz_expression|timestampz_expression_test|timez_expression|timez_expression_test|utils|utils_test|values|window_expression|window_func|window_func_test|with_statement)\.go$
      - ^internal/testutils/(test_utils|time_utils)\.go$
      - ^internal/utils/
      - ^mysql/(cast|cast_test|columns|delete_statement|delete_statement_test|dialect|dialect_test|expressions|expressions_test|functions|functions_test|insert_statement|insert_statement_test|interval_literal|interval_literal_test|lateral|literal|literal_test|lock_statement|lock_statement_test|operators|optimizer_hints|select_json|select_statement|select_statement_test|select_table|set_statement|set_statement_test|statement|table|table_test|types|update_statement|update_statement_test|utils_test|values|with_statement)\.go$
      - ^postgres/(array_columns|cast|cast_test|clause|clause_test|columns|columns_test|conflict_action|delete_statement|delete_statement_test|dialect|dialect_test|expressions|expressions_test|functions|functions_test|insert_statement|insert_statement_test|interval_literal|interval_literal_test|keywords|lateral|lateral_test|literal|literal_test|lock_statement|lock_statement_test|operators|select_json|select_statement|select_statement_test|select_table|set_statement|set_statement_test|statement|table|table_test|types|update_statement|update_statement_test|utils_test|values|with_statement|with_statement_test)\.go$
      - ^qrm/(db|qrm|scan_context|type_stack|utill|utill_test)\.go$
      - ^qrm/internal/
      - ^sqlite/(cast|cast_test|columns|delete_statement|delete_statement_test|dialect|dialect_test|expressions|expressions_test|functions|insert_statement|insert_statement_test|literal|literal_test|on_conflict_clause|operators|select_statement|select_statement_test|select_table|set_statement|set_statement_test|statement|table|table_test|types|update_statement|update_statement_test|utils_test|values|with_statement)\.go$
      - ^stmtcache/
      - ^tests/dbconfig/(dbconfig)\.go$
      - ^tests/internal/utils/
      - ^tests/mysql/(alltypes_test|bench_test|cast_test|delete_test|generator_template_test|generator_test|insert_test|lock_test|main_test|raw_statement_test|sample_test|select_json_test|select_test|stmtcache_test|update_dvds_test|update_test|values_test|with_test)\.go$
      - ^tests/postgres/(alltypes_test|array_test|chinook_db_json_out_test|chinook_db_test|delete_test|generator_template_test|generator_test|insert_test|json_test|lock_test|main_test|northwind_test|range_test|raw_statements_test|sample_test|scan_test|select_json_test|select_test|stmtcache_test|update_test|values_test|with_test)\.go$
      - ^tests/sqlite/(alltypes_test|cast_test|delete_test|generator_test|insert_test|main_test|raw_statement_test|sample_test|select_test|stmtcache_test|update_test|values_test|with_test)\.go$
    # END upstreamfmt
  settings:
    goimports:
      local-prefixes:
        - github.com/nanostack-dev/nanostack-framework

linters:
  settings:
    gocritic:
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          # ${base-path} is this directory (relative-path-mode: cfg); the rules live at the root.
          # They import github.com/quasilyte/go-ruleguard/dsl, which only the root module
          # requires, so lint runs in the repository's go.work (CI creates one).
          rules: ${base-path}/../gorules/functional.go,${base-path}/../gorules/transactor.go
          failOn: all
    misspell:
      # PENELOPE GUINESS is actor 1 of the sakila and dvds test databases.
      ignore-rules:
        - guiness
    revive:
      rules:
        # The tests import the dialect they test with a dot, as go-jet's own tests do.
        - name: dot-imports
          arguments:
            - allowed-packages:
                - github.com/nanostack-dev/nanostack-framework/db/mysql
                - github.com/nanostack-dev/nanostack-framework/db/postgres
                - github.com/nanostack-dev/nanostack-framework/db/sqlite

  # Only Nanostack files are linted. Files taken from go-jet keep upstream's style, so an
  # upstream diff stays small (UPSTREAM.md, rule 1); new upstream files are left out too.
  # A new Nanostack file is added to this list. golangci-lint run applies it to its formatter
  # checks too; golangci-lint fmt does not read it (see formatters.exclusions above).
  exclusions:
    # Each pattern warns whenever its files are clean, and this overlay has no exclusion
    # rules for the warning to guard.
    warn-unused: false
    paths-except:
      - ^cmd/jet/nanostack_version(_test)?\.go$
      - ^cmd/jet/nullable(_test)?\.go$
      - ^filter/
      - ^generator/template/nullable(_test)?\.go$
      - ^generator/template/(render|unique_keys|catalog_methods)(_test)?\.go$
      - ^generator/metadata/(unique_index|read_schema|catalog)\.go$
      - ^generator/metadata/catalog_set(_test)?\.go$
      - ^generator/postgres/(unique_keys|read_schema|catalog)(_test)?\.go$
      - ^generator/(mysql|sqlite)/read_schema(_test)?\.go$
      - ^internal/jet/dialect_switch(_test)?\.go$
      - ^internal/jet/foreign_key\.go$
      - ^internal/jet/optional_arg(_test)?\.go$
      - ^internal/optional/
      - ^internal/testutils/option_parity\.go$
      - ^keyset/
      - ^nanorepo/
      - ^(mysql|postgres|sqlite)/foreign_key\.go$
      - ^(mysql|postgres|sqlite)/literal_option(_test)?\.go$
      - ^(mysql|postgres|sqlite)/statement_option_test\.go$
      - ^qrm/option(_test)?\.go$
      - ^query/
      - ^search/
      - ^tools/upstreamfmt/
      - ^tools/upstreamsync/
      - ^tests/dbconfig/nanostack\.go$
      - ^tests/internal/keysetcontract/
      - ^tests/internal/testenv/
      - ^tests/tools/
      - ^tests/(mysql|postgres|sqlite)/(generator_option|keyset\w*|nanostack_\w+|option\w*|query)_test\.go$
