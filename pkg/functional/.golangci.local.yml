# pkg/functional's additions to lint/base.golangci.yml. It is its own module, so the root
# configuration does not see it. From the repository root, run
# `go run ./lint/cmd/lintconfig -dir pkg/functional` after changing this file or the base.
run:
  relative-path-mode: cfg

formatters:
  settings:
    goimports:
      local-prefixes:
        - github.com/nanostack-dev/nanostack-framework

linters:
  settings:
    gocritic:
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          # ${base-path} is this directory (relative-path-mode: cfg); the rules live at the root.
          # They import github.com/quasilyte/go-ruleguard/dsl, which only the root module
          # requires, so lint runs in the repository's go.work (CI creates one).
          rules: ${base-path}/../../gorules/functional.go
          failOn: all
  exclusions:
    rules:
      - {linters: [gocritic], path: ^slice_bench_test\.go$} # benchmarks Filter().Map() against FilterMap
      - {linters: [gocritic], path: ^slice_test\.go$} # tests the Filter().Map() and Map().FindFirst() chains
      - {linters: [revive], path: ^result_test\.go$} # 410 lines, limit 400
nanostack:
  # One per linter in each rule above; lintconfig fails when they differ.
  exclusion-budget: 3
